<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stall-Vorschau | Stollenhof - Variante</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg-dark: #121212;
            --text-light: #ecf0f1;
        }

        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: var(--bg-dark); font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; }

        .overlay { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; color: white; pointer-events: none; border-left: 4px solid var(--accent); }

        .cow-popup { position: absolute; right: -350px; top: 0; width: 320px; height: 100vh; background: white; color: #333; box-shadow: -10px 0 30px rgba(0,0,0,0.5); transition: right 0.4s cubic-bezier(0.19, 1, 0.22, 1); z-index: 100; padding: 40px 20px; display: flex; flex-direction: column; }
        .cow-popup.active { right: 0; }
        .cow-popup img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 20px; background: #eee; }
        .cow-popup h2 { margin: 0 0 10px 0; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 5px; }
        .cow-popup p { margin: 8px 0; font-size: 0.95rem; }
        .cow-popup .close-btn { position: absolute; top: 10px; left: -40px; width: 40px; height: 40px; background: var(--accent); color: white; border: none; cursor: pointer; font-size: 20px; }

        @media (max-width: 768px) {
            .cow-popup { width: 100%; height: 40%; top: auto; bottom: -40%; right: 0; transition: bottom 0.4s ease; }
            .cow-popup.active { bottom: 0; }
            .cow-popup .close-btn { left: auto; right: 10px; top: -40px; }
        }
    </style>
</head>
<body>

    <div class="overlay">
        <h1 style="font-size: 1.2rem; margin:0;">Stollenhof: Gang-Ansicht (Variante)</h1>
        <p style="font-size: 0.8rem; opacity: 0.8;">Mausrad: Gehen | Klick: Kuh-Infos</p>
    </div>

    <div id="canvas-container"></div>

    <div id="cowPopup" class="cow-popup">
        <button class="close-btn" onclick="closePopup()">×</button>
        <img id="popImg" src="" alt="Kuh Bild">
        <h2 id="popName">Name</h2>
        <p><strong>Platz:</strong> <span id="popPlatz"></span></p>
        <p><strong>Ohrmarke:</strong> <span id="popId"></span></p>
        <p><strong>Status:</strong> <span id="popStatus">Am Fressgitter</span></p>
    </div>

    <!-- Using UMD builds for a standalone variant -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        const cowMeshes = [];
        const loader = new THREE.TextureLoader();

        const config = {
            totalCows: 30,
            spacing: 2.5, // Meter zwischen den Kühen
            assetPath: '/assets/kuh_bilder/',
            fallbackImg: '/assets/kuh_bilder/default.png'
        };

        const cowData = Array.from({ length: config.totalCows }, (_, i) => ({
            id: i + 1,
            name: `Kuh ${i + 1}`,
            ohrmarke: `DE 09 ${8000 + i}`,
            img: `${config.assetPath}${i + 1}.png`
        }));

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.FogExp2(0x111111, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(2, 1.6, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.maxPolarAngle = Math.PI/2.1;
            controls.target.set(0, 1.2, 0);

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(5, 10, 7);
            scene.add(sun);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            createBarn();

            window.addEventListener('wheel', onScroll, {passive:false});
            window.addEventListener('click', onClick);
            window.addEventListener('resize', onResize);

            animate();
        }

        function createBarn() {
            const totalLength = (config.totalCows - 1) * config.spacing;
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(10, totalLength + 10),
                new THREE.MeshStandardMaterial({ color: 0x333333 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, 0, -totalLength/2);
            scene.add(floor);

            for(let i = 0; i < config.totalCows; i++) {
                const zPos = -(i * config.spacing);

                const post = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.05, 2.5),
                    new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.7 })
                );
                post.position.set(-1.5, 1.25, zPos);
                scene.add(post);

                const geometry = new THREE.PlaneGeometry(1.2, 1.2);
                const material = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, transparent: true });

                const plane = new THREE.Mesh(geometry, material);
                plane.position.set(-1.45, 1.2, zPos);
                plane.rotation.y = Math.PI / 2;
                plane.userData = cowData[i];

                // load texture with onError fallback to fallbackImg
                loader.load(
                    cowData[i].img,
                    (tex) => { material.map = tex; material.needsUpdate = true; plane.userData.imageURL = tex.image && (tex.image.src || tex.image.currentSrc) || cowData[i].img; },
                    undefined,
                    () => { loader.load(config.fallbackImg, (t) => { material.map = t; material.needsUpdate = true; plane.userData.imageURL = config.fallbackImg; }); }
                );

                scene.add(plane);
                cowMeshes.push(plane);
            }
        }

        function onScroll(e) {
            e.preventDefault();
            const delta = e.deltaY * 0.02;
            camera.position.z += delta;
            controls.target.z += delta;
        }

        function onClick(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cowMeshes);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                showPopup(data);
            }
        }

        function showPopup(data) {
            const popup = document.getElementById('cowPopup');
            document.getElementById('popName').innerText = data.name;
            document.getElementById('popPlatz').innerText = data.id;
            document.getElementById('popId').innerText = data.ohrmarke;
            const imgEl = document.getElementById('popImg');
            imgEl.src = data.img;
            imgEl.onerror = function(){ this.src = config.fallbackImg; };
            popup.classList.add('active');
        }

        function closePopup() { document.getElementById('cowPopup').classList.remove('active'); }
        function onResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

        init();
    </script>
</body>
</html>
