<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" fill="none">
  <!-- Background -->
  <rect width="220" height="120" fill="transparent"/>

  <!-- Decorative wheat lines top -->
  <line x1="20" y1="18" x2="60" y2="18" stroke="#7c5c2e" stroke-width="1.2" opacity="0.6"/>
  <line x1="160" y1="18" x2="200" y2="18" stroke="#7c5c2e" stroke-width="1.2" opacity="0.6"/>
  <circle cx="18" cy="18" r="2" fill="#7c5c2e" opacity="0.6"/>
  <circle cx="202" cy="18" r="2" fill="#7c5c2e" opacity="0.6"/>

  <!-- Cow silhouette (simple) -->
  <g transform="translate(80, 12)">
    <!-- Body -->
    <ellipse cx="30" cy="28" rx="22" ry="14" fill="#7c5c2e"/>
    <!-- Head -->
    <ellipse cx="52" cy="22" rx="10" ry="8" fill="#7c5c2e"/>
    <!-- Ears -->
    <ellipse cx="47" cy="15" rx="3.5" ry="2" fill="#7c5c2e" transform="rotate(-15 47 15)"/>
    <ellipse cx="60" cy="16" rx="3.5" ry="2" fill="#7c5c2e" transform="rotate(15 60 16)"/>
    <!-- Legs -->
    <rect x="12" y="38" width="5" height="12" rx="2" fill="#7c5c2e"/>
    <rect x="22" y="38" width="5" height="12" rx="2" fill="#7c5c2e"/>
    <rect x="34" y="38" width="5" height="12" rx="2" fill="#7c5c2e"/>
    <rect x="44" y="38" width="5" height="12" rx="2" fill="#7c5c2e"/>
    <!-- Calf -->
    <ellipse cx="6" cy="32" rx="10" ry="7" fill="#a0784a"/>
    <ellipse cx="16" cy="27" rx="5" ry="4" fill="#a0784a"/>
    <rect x="2" y="37" width="3" height="7" rx="1.5" fill="#a0784a"/>
    <rect x="8" y="37" width="3" height="7" rx="1.5" fill="#a0784a"/>
    <!-- Tail -->
    <path d="M8 28 Q0 20 4 12" stroke="#7c5c2e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Udder -->
    <ellipse cx="32" cy="40" rx="6" ry="4" fill="#d4a88a"/>
  </g>

  <!-- Farm name -->
  <text x="110" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5a3e1b" letter-spacing="1">Oberer Stollenhof</text>

  <!-- Divider line -->
  <line x1="55" y1="82" x2="165" y2="82" stroke="#7c5c2e" stroke-width="0.8" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="110" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#7c5c2e" letter-spacing="2" opacity="0.8">SEIT  1497</text>

  <!-- Small wheat decorations around "seit 1497" -->
  <text x="68" y="96" font-family="serif" font-size="8" fill="#7c5c2e" opacity="0.7">❧</text>
  <text x="145" y="96" font-family="serif" font-size="8" fill="#7c5c2e" opacity="0.7">❧</text>
</svg>
