<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Cow + Calf illustration (simplified but accurate to the brown etching style) -->
  <g fill="#6B3A1F" transform="translate(80, 20)">
    <!-- Cow body -->
    <ellipse cx="190" cy="115" rx="100" ry="55" fill="#6B3A1F"/>
    <!-- Cow neck -->
    <path d="M260 80 Q295 55 310 70 Q320 85 300 100 Q280 110 260 108 Z" fill="#6B3A1F"/>
    <!-- Cow head -->
    <ellipse cx="315" cy="68" rx="38" ry="32" fill="#6B3A1F"/>
    <!-- Cow ear left -->
    <ellipse cx="298" cy="42" rx="10" ry="6" fill="#6B3A1F" transform="rotate(-20 298 42)"/>
    <!-- Cow horn left -->
    <path d="M298 40 Q285 20 295 10" stroke="#6B3A1F" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Cow ear right -->
    <ellipse cx="335" cy="43" rx="10" ry="6" fill="#6B3A1F" transform="rotate(20 335 43)"/>
    <!-- Cow horn right -->
    <path d="M335 40 Q348 20 338 10" stroke="#6B3A1F" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Cow eye -->
    <circle cx="320" cy="65" r="5" fill="white"/>
    <circle cx="321" cy="65" r="3" fill="#6B3A1F"/>
    <!-- Cow nose -->
    <ellipse cx="348" cy="78" rx="12" ry="9" fill="#7d4a2a"/>
    <circle cx="344" cy="77" r="2.5" fill="#6B3A1F"/>
    <circle cx="352" cy="77" r="2.5" fill="#6B3A1F"/>
    <!-- Cow white patches -->
    <ellipse cx="180" cy="105" rx="35" ry="25" fill="white" opacity="0.3"/>
    <ellipse cx="210" cy="88" rx="20" ry="15" fill="white" opacity="0.2"/>
    <!-- Cow legs -->
    <rect x="110" y="160" width="18" height="55" rx="8" fill="#6B3A1F"/>
    <rect x="145" y="162" width="18" height="52" rx="8" fill="#6B3A1F"/>
    <rect x="210" y="160" width="18" height="55" rx="8" fill="#6B3A1F"/>
    <rect x="245" y="162" width="18" height="52" rx="8" fill="#6B3A1F"/>
    <!-- Cow tail -->
    <path d="M90 110 Q60 90 65 65 Q67 55 75 60" stroke="#6B3A1F" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Tail tuft -->
    <ellipse cx="73" cy="58" rx="10" ry="7" fill="#6B3A1F"/>
    <!-- Udder -->
    <ellipse cx="175" cy="162" rx="28" ry="16" fill="#8B5035"/>
    <!-- Teats -->
    <rect x="157" y="174" width="6" height="12" rx="3" fill="#7d4428"/>
    <rect x="170" y="176" width="6" height="12" rx="3" fill="#7d4428"/>
    <rect x="183" y="174" width="6" height="12" rx="3" fill="#7d4428"/>

    <!-- Calf (smaller, to the left, slightly behind) -->
    <ellipse cx="95" cy="140" rx="48" ry="28" fill="#6B3A1F"/>
    <!-- Calf head -->
    <ellipse cx="130" cy="122" rx="22" ry="18" fill="#6B3A1F"/>
    <!-- Calf ear -->
    <ellipse cx="118" cy="108" rx="7" ry="4" fill="#6B3A1F" transform="rotate(-15 118 108)"/>
    <!-- Calf eye -->
    <circle cx="134" cy="120" r="3.5" fill="white"/>
    <circle cx="135" cy="120" r="2" fill="#6B3A1F"/>
    <!-- Calf nose -->
    <ellipse cx="148" cy="130" rx="8" ry="6" fill="#7d4a2a"/>
    <!-- Calf legs -->
    <rect x="60" y="162" width="12" height="38" rx="6" fill="#6B3A1F"/>
    <rect x="82" y="163" width="12" height="37" rx="6" fill="#6B3A1F"/>
    <rect x="108" y="163" width="12" height="37" rx="6" fill="#6B3A1F"/>
  </g>

  <!-- Farm name - two lines, serif bold -->
  <text x="250" y="285" text-anchor="middle"
    font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
    font-size="68" font-weight="bold" fill="#6B3A1F" letter-spacing="2">Oberer</text>
  <text x="250" y="355" text-anchor="middle"
    font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
    font-size="68" font-weight="bold" fill="#6B3A1F" letter-spacing="1">Stollenhof</text>

  <!-- Curved wheat / laurel decoration left -->
  <path d="M80 408 Q105 390 130 398 Q155 406 170 400" stroke="#6B3A1F" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Wheat sprig left -->
  <g stroke="#6B3A1F" stroke-width="1.5" opacity="0.7">
    <line x1="90" y1="405" x2="83" y2="395"/>
    <line x1="83" y1="395" x2="78" y2="387"/>
    <line x1="100" y1="401" x2="95" y2="390"/>
    <line x1="95" y1="390" x2="91" y2="381"/>
    <line x1="112" y1="399" x2="108" y2="388"/>
    <line x1="124" y1="399" x2="121" y2="388"/>
  </g>
  <!-- Curved wheat / laurel decoration right -->
  <path d="M420 408 Q395 390 370 398 Q345 406 330 400" stroke="#6B3A1F" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Wheat sprig right -->
  <g stroke="#6B3A1F" stroke-width="1.5" opacity="0.7">
    <line x1="410" y1="405" x2="417" y2="395"/>
    <line x1="417" y1="395" x2="422" y2="387"/>
    <line x1="400" y1="401" x2="405" y2="390"/>
    <line x1="405" y1="390" x2="409" y2="381"/>
    <line x1="388" y1="399" x2="392" y2="388"/>
    <line x1="376" y1="399" x2="379" y2="388"/>
  </g>

  <!-- Milk bottle icon -->
  <g transform="translate(228, 400)" fill="#6B3A1F" opacity="0.9">
    <rect x="5" y="12" width="28" height="38" rx="5" fill="#6B3A1F"/>
    <rect x="9" y="4" width="20" height="12" rx="3" fill="#6B3A1F"/>
    <rect x="11" y="0" width="16" height="6" rx="3" fill="#6B3A1F"/>
    <rect x="7" y="18" width="24" height="4" rx="1" fill="white" opacity="0.4"/>
  </g>

  <!-- "seit 1497" text -->
  <text x="205" y="432" text-anchor="end"
    font-family="'Palatino Linotype', Georgia, serif"
    font-size="26" fill="#6B3A1F" letter-spacing="1">seit</text>
  <text x="298" y="432" text-anchor="start"
    font-family="'Palatino Linotype', Georgia, serif"
    font-size="26" fill="#6B3A1F" letter-spacing="1">1497</text>
</svg>
