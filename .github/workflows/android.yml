name: Android Build

on:
  push:
    branches:
      - "**"
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeiterfassung-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to rolling release
        if: github.ref == 'refs/heads/claude/android-time-tracking-app-Z0gVj'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zeiterfassung-latest
          name: Zeiterfassung – neueste APK
          body: Automatisch gebaute Debug-APK der Zeiterfassungs-App. Auf dem Android-Gerät installieren (unbekannte Quellen erlauben).
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
